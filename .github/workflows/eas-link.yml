# One-time: registers this repo as an EAS project under the Expo account
# and commits the generated projectId back to the branch.
# Requires repository secret: EXPO_TOKEN
name: Link EAS project

on: workflow_dispatch

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Initialize EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --non-interactive --force
      - name: Commit projectId back to the branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Link EAS project (adds extra.eas.projectId)"
            git push
          else
            echo "Nothing to commit — project already linked."
          fi
      - name: Project info
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest project:info
