# Put the right build on version 1.0, and print what still has to be done
# by hand in App Store Connect.
#
# It was meant to attach the in-app purchases too. Apple's API refuses:
# 'subscription' and 'inAppPurchaseV2' are not relationships on
# reviewSubmissionItems, so that part is four clicks in the browser and the
# script says which four.
#
# The only workflow here that writes to App Store Connect. Nothing is
# changed unless the box is ticked; the dry run prints every call it would
# make.
name: Put the build on the version

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "WRITE to App Store Connect (leave off for a dry run)"
        type: boolean
        default: false
      submit:
        description: "Also submit for review (only with WRITE on)"
        type: boolean
        default: false
      build_number:
        description: "Build to put on the version (blank = newest valid)"
        type: string
        required: false

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Put the build on the version
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          CONFIRM: ${{ inputs.confirm && 'yes' || 'no' }}
          SUBMIT: ${{ inputs.confirm && inputs.submit && 'yes' || 'no' }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -o pipefail
          node .github/scripts/asc-attach-purchases.mjs | tee "$GITHUB_STEP_SUMMARY"
