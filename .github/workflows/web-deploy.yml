# Build the website in web/ and deploy it to Cloudflare Workers.
# Requires repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID — the account the Worker belongs to
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Replace the live website
        type: boolean
        default: false

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
      # Named rather than globbed so the deploy gate is an explicit list.
      # ui-components.test.mjs is excluded on purpose: it exercises a vendored
      # component, not a product claim, and has been seen to hang.
      - name: Product-truth guardrails
        run: node --test tests/rendered-html.test.mjs tests/legal-pages.test.mjs tests/canonical-host.test.mjs
      # --skip-build reuses the build above, so a failing guardrail stops the
      # deploy. Worker name, compatibility date and flags come from the
      # committed web/wrangler.jsonc; nothing here may override them.
      - name: Deploy to Cloudflare Workers
        if: ${{ inputs.confirm }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx vinext deploy --skip-build
