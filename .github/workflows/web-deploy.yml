# Build the website in web/ and deploy it to Cloudflare Workers.
# Requires repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID — the account the Worker belongs to
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Replace the live website
        type: boolean
        default: false

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      # `npm test` builds and then runs every guardrail, so the deploy gate and
      # a contributor's local run are the same command and cannot drift apart.
      # A new guardrail is picked up here by being added to that one script.
      - name: Build and product-truth guardrails
        run: npm test
      # The guardrails above read text; this one looks at the page. A sentence
      # rendered one word per line down a 48px column passes every assertion in
      # the suite, and reached the live site twice. Chromium is installed here
      # rather than as a devDependency because CLAUDE.md promises contributors
      # need Node and npm and nothing else.
      - name: Install Chromium for the layout check
        run: npm i --no-save playwright-core@1 && npx --yes playwright@1 install --with-deps chromium
      - name: Layout guardrails
        env:
          LAYOUT_STRICT: "1"
        run: npm run test:layout

      # --skip-build reuses the build above, so a failing guardrail stops the
      # deploy. Worker name, compatibility date and flags come from the
      # committed web/wrangler.jsonc; nothing here may override them.
      - name: Deploy to Cloudflare Workers
        if: ${{ inputs.confirm }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx vinext deploy --skip-build
