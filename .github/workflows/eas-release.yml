# Build the iOS app on Expo's cloud and submit it to TestFlight.
# Requires repository secrets:
#   EXPO_TOKEN      — Expo access token
#   ASC_KEY_ID      — App Store Connect API key ID
#   ASC_ISSUER_ID   — App Store Connect API issuer ID
#   ASC_KEY_P8      — contents of the AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID   — Apple Developer team ID (Membership page)
name: Release to TestFlight

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit to TestFlight after building
        type: boolean
        default: true

jobs:
  ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Restore App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Resolve App Store Connect app id
        if: ${{ inputs.submit }}
        # Runs before the build so a missing app record fails in seconds,
        # not after five minutes of building.
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_APP_ID=$(node .github/scripts/asc-app-id.mjs)
          echo "Resolved ascAppId: $ASC_APP_ID"
          echo "ASC_APP_ID=$ASC_APP_ID" >> "$GITHUB_ENV"
      - name: Build (EAS cloud)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive
      - name: Submit to TestFlight
        if: ${{ inputs.submit }}
        # Recent eas-cli dropped the --asc-api-key-* flags; the ASC key is
        # picked up from these environment variables instead. Non-interactive
        # submits also require the App Store Connect app's numeric ID, which
        # we resolve from the API and inject into eas.json's submit profile.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            j.submit = j.submit || {};
            j.submit.production = j.submit.production || {};
            j.submit.production.ios = { ...(j.submit.production.ios || {}), ascAppId: process.argv[1] };
            fs.writeFileSync('eas.json', JSON.stringify(j, null, 2));
          " "$ASC_APP_ID"
          npx eas-cli@latest submit --platform ios --latest --non-interactive
