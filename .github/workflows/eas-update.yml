# Ship a JavaScript-only change straight to installed builds.
#
# No rebuild, no App Store review, no waiting. Use this for anything that
# lives in src/ — copy, layout, a coaching rule, a scheduling fix.
#
# It CANNOT ship a native change, and that is deliberate rather than a
# limitation. Runtime versions are fingerprinted from the native project,
# so an update built after adding a HealthKit type or a permission simply
# will not be offered to a build that lacks it — refused rather than
# delivered into a crash. If an update seems not to arrive, check the
# fingerprint before anything else:
#
#     npx @expo/fingerprint fingerprint:generate
#
# Requires repository secret: EXPO_TOKEN
name: Ship an over-the-air update

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed (shown in the EAS dashboard and the update history)
        type: string
        required: true
      branch:
        description: Which channel to publish to
        type: choice
        options:
          - production
          - preview
        default: production

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # The gate matters MORE here than it does for a build. A build goes
      # through Apple and then through a tester before it reaches anyone; an
      # update lands on real phones within minutes of this job passing, with
      # nothing in between. A red test here is the last chance to catch it.
      - name: Gate
        run: |
          npx tsc --noEmit
          npx eslint src
          npx jest --ci

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Passed as environment rather than interpolated into the command:
          # a workflow input goes into the shell verbatim, and a message
          # containing a quote would otherwise run as script.
          UPDATE_BRANCH: ${{ inputs.branch }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          npx eas-cli@latest update \
            --branch "$UPDATE_BRANCH" \
            --message "$UPDATE_MESSAGE" \
            --non-interactive
